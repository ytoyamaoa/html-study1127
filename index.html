<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hit & Blow</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
      background-color: #fafafa;
    }
    .debug {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 12px;
    }
    .game-layout {
      display: flex;
      gap: 50px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .left-column {
      flex: 0 0 auto;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 14px;
    }
    .input-panel {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    input[type="text"] {
      width: 150px;
      padding: 8px 10px;
      font-size: 1rem;
      border: 1px solid #bbb;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      padding: 8px 16px;
      font-size: 1rem;
      color: #fff;
      background-color: #1976d2;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      background-color: #1565c0;
    }
    button:disabled {
      background-color: #90caf9;
      cursor: not-allowed;
    }
    .output-message {
      margin-top: 12px;
      min-height: 24px;
      font-weight: bold;
    }
    .history-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .history-group label {
      font-size: 0.9rem;
      color: #444;
    }
    textarea {
      width: 300px;
      height: 200px;
      padding: 8px;
      font-family: monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: #f3f3f3;
      color: #222;
      resize: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="debugAnswer" class="debug"></div>

  <div class="game-layout">
    <div class="left-column">
      <h3>4桁の数を入力してね</h3>
      <div class="input-panel">
        <input
          type="text"
          id="inputBox"
          placeholder="1234"
          maxlength="4"
          aria-label="入力"
        />
        <button type="button" id="checkButton">チェック</button>
      </div>
      <div id="outputMessage" class="output-message"></div>
    </div>

    <div class="history-group">
      <label for="historyArea">履歴:</label>
      <textarea id="historyArea" readonly></textarea>
    </div>
  </div>

  <script>
    // 4桁のランダムな数字の配列を生成（0〜9、重複あり）
    const answer = Array.from({ length: 4 }, () => Math.floor(Math.random() * 10));

    // デバッグ用に答えを表示（公開時に隠したい場合は下の2行をコメントアウトまたは削除してください）
    const debugEl = document.getElementById("debugAnswer");
    debugEl.textContent = `(デバッグ用答え: ${answer.join("")})`;

    const inputBox = document.getElementById("inputBox");
    const checkButton = document.getElementById("checkButton");
    const outputMessage = document.getElementById("outputMessage");
    const historyArea = document.getElementById("historyArea");

    function handleCheck() {
      const userInput = inputBox.value.trim();
      outputMessage.textContent = "";

      // バリデーション（4桁の数字のみ）
      if (!/^\d{4}$/.test(userInput)) {
        outputMessage.textContent = "※4桁の数字を入力してください";
        return;
      }

      // ヒットの判定
      let hit = 0;
      for (let i = 0; i < 4; i++) {
        if (answer[i] === Number(userInput[i])) {
          hit += 1;
        }
      }

      // ブローの判定（元のPythonコードと同じ重複除外ロジック）
      let blow = 0;
      for (let j = 0; j < 4; j++) {
        if (userInput.slice(0, j).includes(userInput[j])) {
          continue;
        }
        for (let i = 0; i < 4; i++) {
          if (Number(userInput[j]) === answer[i] && answer[i] !== Number(userInput[i])) {
            blow += 1;
            break;
          }
        }
      }

      // 結果表示と履歴への追加
      if (hit === 4) {
        outputMessage.textContent = "🎉 あたり！ Complete!";
        inputBox.disabled = true;
        checkButton.disabled = true;
      } else {
        historyArea.value += `${userInput} / hit: ${hit}, blow: ${blow}\n`;
        inputBox.value = "";
        inputBox.focus();
      }
    }

    checkButton.addEventListener("click", handleCheck);

    // Enterキーでもチェックできるように補助
    inputBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !checkButton.disabled) {
        handleCheck();
      }
    });
  </script>
</body>
</html>
