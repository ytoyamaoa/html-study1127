<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正多角形ビューア</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 24px 16px;
      background-color: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
      color: #0f172a;
    }

    .subtitle {
      margin: 0 0 20px;
      font-size: 0.92rem;
      color: #475569;
    }

    .canvas-wrapper {
      text-align: center;
      margin-bottom: 20px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background-color: #f8fafc;
    }

    .controls {
      display: flex;
      align-items: center;
      flex-direction: column;
      gap: 14px;
      padding: 16px;
      background-color: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>正多角形ビューア</h1>
    <p class="subtitle">スライダーで頂点数を変えて、正三角形から正十二角形まで描画します。</p>

    <div class="canvas-wrapper">
      <canvas id="polygonCanvas" width="480" height="360"></canvas>
    </div>

    <section class="controls" aria-label="多角形の設定">
      <div class="control-row">
        <label for="sidesRange">頂点数（角の数）: <span id="sidesValue">5</span>角形</label>
        <input type="range" id="sidesRange" min="3" max="12" value="5">
      </div>

      <div class="control-row">
        <label class="checkbox-label">
          <input type="checkbox" id="showGuideToggle" checked>
          補助線を表示
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="fillPolygonToggle" checked>
          内側を塗りつぶす
        </label>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("polygonCanvas");
    const ctx = canvas.getContext("2d");

    const sidesRange = document.getElementById("sidesRange");
    const sidesValue = document.getElementById("sidesValue");
    const showGuideToggle = document.getElementById("showGuideToggle");
    const fillPolygonToggle = document.getElementById("fillPolygonToggle");

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const radius = 120;

    function getPolygonVertices(sides, startAngle = -Math.PI / 2) {
      const vertices = [];
      const stepAngle = (Math.PI * 2) / sides;

      for (let i = 0; i < sides; i++) {
        const angle = startAngle + stepAngle * i;
        const x = cx + radius * Math.cos(angle);
        const y = cy + radius * Math.sin(angle);
        vertices.push({ x, y });
      }

      return vertices;
    }

    function drawGuides(vertices) {
      ctx.save();

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.setLineDash([]);
      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 1;
      vertices.forEach((v) => {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(v.x, v.y);
        ctx.stroke();
      });

      ctx.beginPath();
      ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = "#475569";
      ctx.fill();

      ctx.restore();
    }

    function drawPolygon() {
      const sides = Number(sidesRange.value);
      sidesValue.textContent = String(sides);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const vertices = getPolygonVertices(sides);

      if (showGuideToggle.checked) {
        drawGuides(vertices);
      }

      ctx.beginPath();
      vertices.forEach((v, index) => {
        if (index === 0) {
          ctx.moveTo(v.x, v.y);
        } else {
          ctx.lineTo(v.x, v.y);
        }
      });
      ctx.closePath();

      if (fillPolygonToggle.checked) {
        ctx.fillStyle = "rgba(59, 130, 246, 0.22)";
        ctx.fill();
      }

      ctx.strokeStyle = "#2563eb";
      ctx.lineWidth = 3;
      ctx.lineJoin = "round";
      ctx.stroke();

      vertices.forEach((v) => {
        ctx.beginPath();
        ctx.arc(v.x, v.y, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.strokeStyle = "#1d4ed8";
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    sidesRange.addEventListener("input", drawPolygon);
    showGuideToggle.addEventListener("change", drawPolygon);
    fillPolygonToggle.addEventListener("change", drawPolygon);

    drawPolygon();
  </script>
</body>
</html>
