<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas グラフ・図形ビューア</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Canvas グラフ・図形ビューア</h1>
    <p class="subtitle">操作パネルから線の太さや塗りつぶし、データを切り替えて描画を確認できます。</p>

    <div class="canvas-wrapper">
      <canvas id="chartCanvas" width="600" height="320"></canvas>
    </div>

    <section class="controls" aria-label="描画設定">
      <div class="control-row">
        <label for="lineWidthRange">線の太さ: <span id="lineWidthValue">3</span>px</label>
        <input type="range" id="lineWidthRange" min="1" max="10" value="3">
      </div>

      <div class="control-row">
        <label class="checkbox-label">
          <input type="checkbox" id="fillToggle" checked>
          下側を塗りつぶす（エリア表示）
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="pointToggle" checked>
          頂点に丸印を表示する
        </label>
      </div>

      <div class="button-group">
        <button type="button" id="presetBtn">サンプルデータ切替</button>
        <button type="button" id="randomBtn" class="secondary">ランダム生成</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
