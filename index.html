<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正多角形ビューア</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>正多角形ビューア</h1>
    <p class="subtitle">スライダーで頂点数を変えて、正三角形から正十二角形まで描画します。</p>

    <div class="canvas-wrapper">
      <canvas id="polygonCanvas" width="480" height="360"></canvas>
    </div>

    <section class="controls" aria-label="多角形の設定">
      <div class="control-row">
        <label for="sidesRange">頂点数（角の数）: <span id="sidesValue">5</span>角形</label>
        <input type="range" id="sidesRange" min="3" max="12" value="5">
      </div>

      <div class="control-row">
        <label class="checkbox-label">
          <input type="checkbox" id="showGuideToggle" checked>
          外接円と中心からの補助線を表示
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="fillPolygonToggle" checked>
          内側を塗りつぶす
        </label>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
